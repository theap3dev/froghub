<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts | frogchat</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=6">
</head>
<body>
    <header class="topbar">
        <h1 class="brand"><a class="brand-link" href="index.html"><img class="brand-logo" src="assets/img/logo-removebg-preview.png" alt="">frogchat</a></h1>
        <nav class="topbar-nav" aria-label="Main navigation">
            <a class="topbar-link" href="index.html">Home</a>
            <a class="topbar-link" href="users.html">Members</a>
            <a class="topbar-link" id="account-link" href="account.html" hidden>Account</a>
        </nav>
    </header>

    <main class="auth-layout posts-page-layout">
        <section class="posts-section" aria-labelledby="posts-title">
            <header class="posts-header">
                <div>
                    <p class="posts-kicker">COMMUNITY FEED</p>
                    <h2 id="posts-title">Latest posts</h2>
                </div>
                <button class="refresh-button" id="refresh-posts" type="button">Refresh</button>
            </header>

            <form class="post-composer" id="post-form" hidden>
                <label class="field">
                    <span>Title</span>
                    <input id="post-title" name="title" type="text" maxlength="160" placeholder="Give your post a title" required>
                </label>
                <label class="field">
                    <span>Post</span>
                    <textarea id="post-body" name="body" rows="5" maxlength="5000" placeholder="What’s on your mind?" required></textarea>
                </label>
                <label class="field">
                    <span>Tags</span>
                    <input id="post-tags" name="tags" type="text" maxlength="180" placeholder="security, web, python" autocomplete="off">
                    <small>Separate tags with commas. Up to 5 tags, using letters, numbers, and hyphens.</small>
                </label>
                <label class="field">
                    <span>Photo (optional)</span>
                    <input id="post-image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
                    <small>JPEG, PNG, WebP, or GIF. Maximum size: 8 MB.</small>
                </label>
                <img class="post-image-preview" id="post-image-preview" alt="Selected photo preview" hidden>
                <button class="submit-button" id="post-submit" type="submit">Publish post</button>
            </form>
            <p class="post-feedback" id="post-feedback" role="status" aria-live="polite"></p>
            <div class="post-list" id="post-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="assets/js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/posts.js?v=5"></script>
</body>
</html>
